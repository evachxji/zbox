<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>C · 软糖贴纸 Candy Pop</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
  body{
    font-family:"Microsoft YaHei UI","Segoe UI",sans-serif;
    background:
      radial-gradient(1000px 650px at 20% 20%, #3a5a8c 0%, transparent 55%),
      radial-gradient(800px 550px at 85% 85%, #6b4a7a 0%, transparent 50%),
      linear-gradient(150deg,#1b2432,#101620);
    min-height:100vh;display:flex;align-items:center;justify-content:center;gap:52px;padding:40px;
  }
  .panel{
    background:#fbf4e6;
    border:2.5px solid #23201b;
    border-radius:22px;
    box-shadow:8px 10px 0 rgba(10,10,10,.45);
    color:#23201b;
    display:flex;flex-direction:column;overflow:hidden;
  }
  .single{width:344px;height:500px}
  .dual{width:692px;height:500px}
  /* titlebar */
  .titlebar{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 8px}
  .tabs{display:flex;gap:8px}
  .tabs button{
    border:2px solid #23201b;background:#fff;font:700 13px/1 inherit;font-family:inherit;
    color:#23201b;padding:7px 18px;border-radius:999px;cursor:pointer;
    box-shadow:2.5px 3px 0 #23201b;transition:.12s;
  }
  .tabs button.active{background:#ffd23e;transform:translate(1px,1px);box-shadow:1.5px 2px 0 #23201b}
  .tabs button.active.pink{background:#ff9ec6}
  .win-actions{display:flex;gap:6px}
  .win-actions button{
    width:30px;height:28px;border:2px solid #23201b;background:#fff;border-radius:9px;
    color:#23201b;font-size:12px;font-weight:700;cursor:pointer;box-shadow:2px 2.5px 0 #23201b;transition:.12s;
  }
  .win-actions button:hover{background:#b8e6ff}
  .win-actions button.on{background:#8fd8ff}
  /* calendar */
  .cal{flex:1;display:flex;flex-direction:column;padding:0 14px;min-width:0}
  .cal-head{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 10px}
  .cal-title{font-size:17px;font-weight:800}
  .cal-title small{font-size:10.5px;font-weight:700;color:#9b8f78;margin-left:6px}
  .cal-nav{display:flex;align-items:center;gap:6px}
  .cal-nav button{border:2px solid #23201b;background:#fff;color:#23201b;width:27px;height:25px;border-radius:8px;font-size:13px;font-weight:800;cursor:pointer;box-shadow:2px 2px 0 #23201b}
  .cal-nav button:hover{background:#b8e6ff}
  .cal-nav .today-btn{width:auto;padding:0 10px;font:800 11px/1 inherit;font-family:inherit;background:#8fd8ff}
  .cal-nav .today-btn:hover{background:#ffd23e}
  .week-row{display:grid;grid-template-columns:repeat(7,1fr);padding:0 0 6px}
  .week-row span{text-align:center;font-size:10.5px;font-weight:800;color:#9b8f78}
  .week-row span.we{color:#e2543e}
  .grid{flex:1;display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr;gap:2px}
  .cell{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:11px;cursor:pointer;border:2px solid transparent}
  .cell:hover{border-color:#23201b;background:#fff}
  .cell .d{font-family:"Bahnschrift",sans-serif;font-size:15px;font-weight:700;height:23px;line-height:23px;min-width:23px;text-align:center;border-radius:8px}
  .cell.dim .d{color:#c9bda3}
  .cell.we .d{color:#e2543e}
  .cell.dim.we .d{color:#e2b4a8}
  .cell.today .d{background:#23201b;color:#ffd23e}
  .cell .sub{font-size:9px;font-weight:700;height:12px;line-height:12px;color:#9b8f78}
  .cell .sub.fest{color:#e2543e}
  .cell .badge{position:absolute;top:1px;right:2px;font-size:8px;font-weight:800;padding:0 4px;border-radius:999px;line-height:13px;border:1.5px solid #23201b}
  .cell .badge.off{background:#ff9ec6;color:#23201b}
  .cell .badge.work{background:#d9d2c1;color:#6b6151;border-color:#9b8f78}
  .cell .dot{position:absolute;bottom:3px;width:5px;height:5px;border-radius:50%;background:#3e8fe2;border:1px solid #23201b}
  .cal-foot{padding:8px 2px 10px;font-size:10.5px;font-weight:700;color:#9b8f78;text-align:center;letter-spacing:.5px}
  /* todo */
  .todo{flex:1;display:flex;flex-direction:column;min-width:0;border-left:2.5px solid #23201b;background:#fdf9ef}
  .todo-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 10px}
  .todo-head b{font-size:15px;font-weight:800}
  .todo-head span{font-size:10.5px;font-weight:800;color:#23201b;background:#ffd23e;border:2px solid #23201b;padding:2px 9px;border-radius:999px}
  .todo-list{flex:1;overflow:hidden;padding:0 10px;list-style:none}
  .todo-list li{display:flex;align-items:center;gap:10px;padding:7px 10px;margin-bottom:5px;border-radius:12px;cursor:pointer;background:#fff;border:2px solid #23201b;box-shadow:2px 2.5px 0 rgba(35,32,27,.9)}
  .todo-list li:hover{transform:translate(1px,1px);box-shadow:1px 1.5px 0 rgba(35,32,27,.9)}
  .cb{width:18px;height:18px;border-radius:6px;border:2.5px solid #23201b;background:#fff;flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:#fff;transition:.12s}
  .cb.on{background:#57c45f}
  .tx{flex:1;font-size:12.5px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .due{font-size:9.5px;font-weight:800;color:#23201b;background:#b8e6ff;padding:2px 8px;border-radius:999px;border:1.5px solid #23201b;flex:none}
  .due.late{background:#ff9ec6}
  li.done{background:#efe9db;border-color:#b9b09c;box-shadow:none;opacity:.75}
  li.done .tx{color:#9b8f78;text-decoration:line-through}
  li.done .cb{border-color:#9b8f78}
  li.done .due{visibility:hidden}
  .todo-add{margin:6px 12px 12px;padding:10px;border:2px dashed #9b8f78;border-radius:12px;color:#9b8f78;font-size:12px;font-weight:700;text-align:center;cursor:pointer}
  .todo-add:hover{border-color:#23201b;color:#23201b;background:#fff}
  .dual-body{flex:1;display:flex;min-height:0}
</style>
</head>
<body>

<div class="panel single">
  <div class="titlebar">
    <div class="tabs"><button class="active">📅 日历</button><button>✔ 待办</button></div>
    <div class="win-actions"><button title="展开双栏">⧉</button><button title="关闭">✕</button></div>
  </div>
  <div class="cal">
    <div class="cal-head">
      <div class="cal-title">2026年9月<small>农历八月</small></div>
      <div class="cal-nav"><button>‹</button><button class="today-btn">今天</button><button>›</button></div>
    </div>
    <div class="week-row"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span class="we">六</span><span class="we">日</span></div>
    <div class="grid" data-cal></div>
  </div>
  <div class="cal-foot">🖱 滚轮翻月 · 点「今天」回来</div>
</div>

<div class="panel dual">
  <div class="titlebar">
    <div class="tabs"><button class="active">📅 日历</button><button class="active pink">✔ 待办</button></div>
    <div class="win-actions"><button class="on" title="收起为单栏">⧉</button><button title="关闭">✕</button></div>
  </div>
  <div class="dual-body">
    <div class="cal">
      <div class="cal-head">
        <div class="cal-title">2026年9月<small>农历八月</small></div>
        <div class="cal-nav"><button>‹</button><button class="today-btn">今天</button><button>›</button></div>
      </div>
      <div class="week-row"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span class="we">六</span><span class="we">日</span></div>
      <div class="grid" data-cal></div>
      <div class="cal-foot">🖱 滚轮翻月</div>
    </div>
    <div class="todo">
      <div class="todo-head"><b>待办清单</b><span>3 未完成</span></div>
      <ul class="todo-list">
        <li><span class="cb"></span><span class="tx">整理 Q3 复盘文档</span><span class="due late">逾期2天</span></li>
        <li><span class="cb"></span><span class="tx">给妈妈回电话</span><span class="due">今天</span></li>
        <li><span class="cb"></span><span class="tx">国庆出游订酒店</span><span class="due">9.30</span></li>
        <li class="done"><span class="cb on">✓</span><span class="tx">缴纳水电费</span><span class="due"></span></li>
        <li class="done"><span class="cb on">✓</span><span class="tx">周报已提交</span><span class="due"></span></li>
      </ul>
      <div class="todo-add">＋ 双击空白处新建待办</div>
    </div>
  </div>
</div>

<script>
const HOLIDAYS={
  '2026-09-25':{n:'中秋',off:1},
  '2026-10-01':{n:'国庆',off:1},'2026-10-02':{n:'假期',off:1},'2026-10-03':{n:'假期',off:1},
  '2026-10-04':{n:'假期',off:1},'2026-10-05':{n:'假期',off:1},'2026-10-06':{n:'假期',off:1},'2026-10-07':{n:'假期',off:1},
};
const WORKDAYS={'2026-09-26':1,'2026-10-10':1};
const TODOS={'2026-09-28':1,'2026-09-30':1,'2026-10-09':1};
const TODAY='2026-09-28';
function pad(n){return String(n).padStart(2,'0')}
function build(grid){
  const y=2026,m=8;
  const offset=(new Date(y,m,1).getDay()+6)%7;
  const daysIn=new Date(y,m+1,0).getDate();
  const prevDays=new Date(y,m,0).getDate();
  for(let i=0;i<42;i++){
    const dnum=i-offset+1;
    let dd,dim=false,dt;
    if(dnum<1){dt=new Date(y,m-1,prevDays+dnum);dim=true}
    else if(dnum>daysIn){dt=new Date(y,m+1,dnum-daysIn);dim=true}
    else{dt=new Date(y,m,dnum)}
    dd=dt.getDate();
    const key=`${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dd)}`;
    const wd=dt.getDay();
    const cell=document.createElement('div');
    cell.className='cell'+(dim?' dim':'')+((wd===0||wd===6)?' we':'')+(key===TODAY?' today':'');
    let html=`<span class="d">${dd}</span>`;
    const h=HOLIDAYS[key];
    if(h){html+=`<span class="badge off">休</span><span class="sub fest">${h.n}</span>`}
    else if(WORKDAYS[key]){html+=`<span class="badge work">班</span><span class="sub"></span>`}
    else{html+=`<span class="sub"></span>`}
    if(TODOS[key])html+=`<span class="dot"></span>`;
    cell.innerHTML=html;
    grid.appendChild(cell);
  }
}
document.querySelectorAll('[data-cal]').forEach(build);
</script>
</body>
</html>
