<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>方案 B &#183; 浅色极简</title><style>
html,body{margin:0;padding:0}

.layer{position:absolute;inset:0}

.veil{background:rgba(6,8,12,.28)}

.wp{position:absolute;inset:0;background:linear-gradient(155deg,#33465c 0%,#1d2937 55%,#26313f 100%)}

.main{position:absolute;left:150px;top:44px;right:0;bottom:0;background:#fff;padding:26px 34px}

.chip{margin-top:14px;width:118px;height:18px;background:#edf1f6;border-radius:9px}
.pl{margin-top:20px}

.imgb{margin-top:22px;width:560px;height:200px;border-radius:8px;background:linear-gradient(135deg,#41546e,#63809f);position:relative;overflow:hidden}

.code{margin-top:24px;width:560px;height:88px;background:#14171c;border-radius:8px;padding:14px 18px;box-sizing:border-box}

/* ---- 选区 ---- */
.sel{position:absolute;left:240px;top:170px;width:990px;height:600px;box-sizing:border-box}
.h{position:absolute;width:8px;height:8px;box-sizing:border-box}
.h.nw{left:-4px;top:-4px}.h.n{left:50%;margin-left:-4px;top:-4px}.h.ne{right:-4px;top:-4px}
.h.e{right:-4px;top:50%;margin-top:-4px}.h.se{right:-4px;bottom:-4px}.h.s{left:50%;margin-left:-4px;bottom:-4px}
.h.sw{left:-4px;bottom:-4px}.h.w{left:-4px;top:50%;margin-top:-4px}
.sizelabel{position:absolute;left:240px;top:140px;padding:5px 10px;border-radius:4px;font:12px Consolas,'Segoe UI',monospace;letter-spacing:.5px;white-space:nowrap}

.annot{position:absolute;inset:0}
.atext{position:absolute;left:786px;top:294px;font:600 15px 'Microsoft YaHei';color:#ffd54a;text-shadow:0 1px 3px rgba(0,0,0,.65)}
.ainv{position:absolute;left:1012px;top:716px;font:600 13px 'Microsoft YaHei';color:#fff;background:#14161c;padding:5px 12px;border-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,.4);white-space:nowrap}
/* ---- 工具条 ---- */
.bar{position:absolute;top:782px;right:370px;display:flex;align-items:center;padding:6px;gap:2px;box-sizing:border-box}
.tbtn{height:32px;min-width:32px;display:flex;align-items:center;justify-content:center;border:none;background:transparent;border-radius:6px;cursor:pointer;padding:0 5px;gap:5px}
.tbtn svg{width:17px;height:17px;flex:none}
.lbl{font-size:12px;font-family:'Microsoft YaHei'}
.sep{width:1px;height:18px;margin:0 5px;flex:none}
.confirm{height:32px;border:none;border-radius:6px;padding:0 14px;font:600 12.5px 'Microsoft YaHei';display:flex;align-items:center;gap:6px;cursor:pointer}
.confirm svg{width:15px;height:15px}
.subbar{position:absolute;top:836px;right:370px;display:flex;align-items:center;padding:7px 12px;gap:8px;box-sizing:border-box}
.dot{width:16px;height:16px;border-radius:50%;cursor:pointer;flex:none;box-sizing:border-box}
.size{width:26px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:4px;font:600 11px Consolas,monospace;cursor:pointer;flex:none}
.invert{height:23px;padding:0 11px;display:flex;align-items:center;border-radius:12px;font:600 11px 'Microsoft YaHei';cursor:pointer;flex:none;box-sizing:border-box}

.pin-thumb{height:140px;border-radius:4px;position:relative;overflow:hidden;background:linear-gradient(135deg,#3b4c61,#22303f);box-sizing:border-box}

.pin-thumb .pw i{display:block;height:7px;background:#d7dbe0;border-radius:3px;margin-bottom:8px}
.pin-thumb .pw i:first-child{width:90px;height:9px;background:#2a2e35}
.pin-cap{margin-top:9px;text-align:center;font:11px 'Microsoft YaHei';padding:6px 0;border-radius:11px;white-space:nowrap}
.tag{position:absolute;left:24px;bottom:20px;padding:7px 15px;border-radius:13px;font:600 12px 'Microsoft YaHei';letter-spacing:1px}


.sel{border:1px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.5)}

.size{color:#888}.size.on{background:#eef1f5;color:#222}
.invert{border:1px solid #d6d6db;color:#555}.invert.on{background:#22262c;color:#fff;border-color:#22262c}
.pin-thumb{border:1px solid rgba(0,0,0,.15);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.pin-cap{background:rgba(255,255,255,.92);color:#555;border:1px solid #e3e3e8}
.tag{background:rgba(255,255,255,.92);color:#333;border:1px solid #e3e3e8}
